<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAL Game</title>

    <!-- 載入 CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==========================
         遊戲主畫面
    =========================== -->

    <div id="game">

        <!-- 場景 -->
        <div id="scene">

            <!-- 背景名稱 -->
            <div id="background-text"></div>

            <!-- 角色 -->
            <div id="character"></div>

            <!-- 對話框 -->
            <div id="message-box">

                <!-- 說話的人 -->
                <div id="name"></div>

                <!-- 台詞 -->
                <div id="text"></div>

                <!-- 下一句提示 -->
                <div id="next">▼</div>

            </div>

        </div>

    </div>


    <!-- ==========================
         JavaScript
    =========================== -->

    <!-- 劇情資料 -->
    <script src="js/story.js"></script>

    <!-- 遊戲邏輯 -->
    <script src="js/game.js"></script>

</body>

</html>
